agent_card:
  name: HORIZON SHIELD KIRA
  description: >-
    An independent, pre-transaction auditor for construction and renovation estimates. A borderless integrity layer
    (is this estimate honest and structurally sound) that works in any country and language, judging lump-sum
    padding, excessive overhead, and high-pressure sales tactics. Built on 30 years of field experience by a Japanese
    master carpenter. Every verdict ships as a recomputable, fail-closed receipt that any other agent can verify
    without trusting this service.
  url: https://mcp.horizonshield.dev
  version: 1.0.0
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  supported_interfaces:
  - {url: 'https://mcp.horizonshield.dev', protocolBinding: JSONRPC, protocolVersion: '1.0'}
  - {url: 'https://mcp.horizonshield.dev', protocolBinding: JSONRPC, protocolVersion: '0.3'}
  provider:
    organization: The HORIZ音s株式会社
    url: https://shield.the-horizons-innovation.com
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
    extensions:
    - uri: https://gate.horizonshield.dev/ext/conduct/v1
      required: false
      description: A2A Conduct Extension v1 — who pays this agent (paid_by buyer, referral_fee false, listing_fee false, success_fee_pct 0), where its measured conduct record lives, and where to file a witness walk. Authored and served by this provider.
  default_input_modes: [text/plain, application/json]
  default_output_modes: [application/json, text/plain]
  security_schemes: null
  security: null
  documentation_url: https://shield.the-horizons-innovation.com
  icon_url: null
  signatures: 1 JWS (ES256, kid hs-2026-09, jku https://mcp.horizonshield.dev/.well-known/jwks.json)
  skill_count: 3
  skills:
  - {id: estimate-integrity-audit, name: Estimate integrity audit (borderless), tags: [construction, estimate, audit, fraud-detection, credence-goods, borderless, price-verification, overcharge-detection, second-opinion, planning-stage], examples: 15}
  - {id: japan-property-reform-intake, name: Japan property acquisition and renovation intake, tags: [japan, real-estate, renovation, intake, takkenshi, cross-border], examples: 4}
  - {id: verify-claim, name: Integrity claim verification (fail closed), tags: [verification, integrity, fail-closed, tamper-evident, a2a, credence-goods], examples: 2}
  provider_specific_fields:
    compensation: {paid_by: buyer, referral_fee: false, listing_fee: false, success_fee_pct: 0, disclosure_url: 'https://shield.the-horizons-innovation.com/verify-directory/'}
    ledger: {name: JIDEC, url: 'https://hs-ledger.oga-surf-project.workers.dev', catalog: 'https://hs-ledger.oga-surf-project.workers.dev/.well-known/api-catalog', mcp: 'https://hs-jidec-mcp.oga-surf-project.workers.dev/mcp'}
    dataset: {name: Japan Construction Cost Database (JCCDB), license: CC BY 4.0, doi: 'https://doi.org/10.5281/zenodo.22127752'}
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: true
  grade_basis: >-
    capabilities is an OBJECT (streaming, pushNotifications, stateTransitionHistory, extensions[]); protocolVersion
    "0.3.0" is present at the top level; skills is an ARRAY of three fully-populated skills (id, name, description,
    tags, examples). All three optional discriminators are present. The card carries BOTH the 0.3.0 triple
    (url + preferredTransport + protocolVersion) and a 1.0-style supportedInterfaces[] block declaring JSONRPC at
    protocolVersion 1.0 and 0.3, so a reader written against either revision finds its fields. It is signed (JWS
    ES256) with a key resolvable from the same host's /.well-known/jwks.json.
  deviations:
  - field: securitySchemes / security
    observed: absent
    note: The agent is anonymous by design (the MCP server, the plugin README and the site all say "no API key"); the card does not say so in the A2A vocabulary, so a client cannot read the auth posture from securitySchemes.
  - field: url / supportedInterfaces[].url
    observed: https://mcp.horizonshield.dev — the same URL as the MCP Streamable HTTP endpoint
    note: One JSON-RPC URL multiplexes MCP methods (initialize, tools/list, tools/call, prompts/*) and A2A methods (message/send). Verified live for both. tasks/get and agent/getAuthenticatedExtendedCard return -32601.
  - field: compensation / ledger / dataset
    observed: provider-specific top-level fields
    note: Not in the A2A schema. compensation duplicates the conduct extension's params so a reader that ignores extensions still sees who pays; ledger and dataset point at the JIDEC ledger and the CC BY 4.0 JCCDB dataset (DOI). The ledger URLs here are the workers.dev origins; the custom domains https://ledger.horizonshield.dev and https://jidec.horizonshield.dev/mcp serve the same services.
  - field: skills[].inputModes / outputModes / security
    observed: absent on every skill
    note: Optional per-skill fields; the card relies on the defaults (text/plain, application/json).
