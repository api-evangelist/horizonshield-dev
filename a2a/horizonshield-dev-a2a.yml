surface_relationship:
  note: >-
    One company, one signing key (kid hs-2026-09, one JWKS per host), six agent cards. KIRA (mcp.) is the product:
    price audit + verifiable receipts + AP2 attestation. JIDEC (ledger./jidec.) is the audit-of-the-auditor: an
    append-only, Bitcoin-anchored ledger with an RFC 9727 api-catalog. The gate (gate.) is a public conformance
    register for OTHER people's MCP servers, with the only OpenAPI in the family. Yakumo (hearing.) is the verified
    contractor directory. WebMCP (web.) is an intake desk. Femtech (femtech.) is a separate registry product. Every
    card declares the same A2A Conduct Extension, whose specification the company itself serves at
    https://gate.horizonshield.dev/ext/conduct/v1 — see conformance/horizonshield-dev-conformance.yml.
