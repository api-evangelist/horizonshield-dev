  note: The A2A endpoints extend the message with the methods they DO implement ("SendMessage (1.0) and message/send (0.3)") and what to send.
tool_result_semantics:
  source: outputSchema on every KIRA tool (mcp/horizonshield-dev-mcp-tools.json) and the JIDEC tools
  rules:
  - 'lookup: "ok" = source read and something matched; "absent" = source read and nothing matched.'
  - 'A source that could NOT be read never appears as a result — the tool returns isError: true, so a server failure is never mistaken for "nothing exists".'
  - 'count: 0 means read-and-empty, never could-not-read.'
  - 'audit_estimate / get_price_range: no match -> did_you_mean candidates; ambiguous candidates -> "ambiguous" instead of a verdict; unit-vs-total confusion -> unit_mismatch guidance.'
  - 'find_verified_contractor / Yakumo tools: zero matches are returned as zero; stores still in verification are returned separately as pending.'
verification_failure_taxonomy:
  source: well-known/horizonshield-dev-verification-contract.json (contract 0.3) — also the return contract of verify_integrity_claim
  result_values:
    verified: every check available for this call ran and passed
    partial: nothing failed, but at least one available check was not requested (skipped_because_not_requested)
    unverified: a check failed, or the claim could not be recomputed
  failure_reasons:
  - {reason: stale_data, user_meaning: recheck later, triggers: [expired_declaration]}
  - {reason: changed_scope, user_meaning: re-audit required, triggers: [changed_estimate_version]}
  - {reason: missing_evidence, user_meaning: do not trust, triggers: [missing_receipt, unverifiable_chain]}
  policy: 'Fail closed. If the claim cannot be recomputed or the chain cannot be verified, the result is unverified. Never a soft pass.'
gate_verdict_states:
  source: https://gate.horizonshield.dev/is-verified and the mcp-conduct README
  states: {verified: 'latest scheduled measurement passed every measured condition (true)', pending: 'measured, at least one condition did not pass or was not measured (null)', held: 'server or relay unreachable — not a verdict (null)', watched: 'on the register, not measured yet (null)', absent: 'never measured; absence is not a negative verdict (null)'}
  note: verified is true or null, never false.
