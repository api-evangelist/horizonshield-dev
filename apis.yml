- aid: horizonshield-dev:webmcp-intake-server
  name: HORIZON SHIELD WebMCP Intake Server
  description: >-
    A second public MCP endpoint at https://web.horizonshield.dev/mcp (serverInfo hs-webmcp 1.0.4, protocol
    2025-06-18; server.json published at shield.the-horizons-innovation.com/server-webmcp.json) acting as an intake
    desk for external LLMs and agents: route_request, run_full_audit (audit + tactics scan + awareness draft in
    one call), intake_estimate (bridges a homeowner quote to the internal KIRA audit and a free EHN third-party
    check), scan_tactics and draft_broadcast. All five tools are annotated read-only and idempotent.
  humanURL: https://shield.the-horizons-innovation.com/llms.txt
  baseURL: https://web.horizonshield.dev/mcp
  tags:
  - MCP
  - agent-native
  - Cost Estimation
  properties:
  - type: MCPServer
    name: WebMCP intake endpoint (Streamable HTTP, POST)
    url: https://web.horizonshield.dev/mcp
- aid: horizonshield-dev:femtech-source-registry-mcp
  name: HORIZON SHIELD Femtech Source Registry MCP
  description: >-
    A separate product line by the same company: a neutral, verifiable registry of femtech information sources
    exposed as a remote MCP server at https://femtech.horizonshield.dev/mcp (hs-femtech-mcp 0.4.1) with nine tools
    (register a source after machine checks of five conditions, list and fetch entries, third-party hash
    verification, neutral topic and product-category explainers, how-to-verify, agent card, check a source) and a
    JWS-signed A2A card at /.well-known/agent-card.json. Explicitly makes no diagnosis or efficacy claims. Source
    is public at github.com/ogasurfproject-jpg/hs-femtech-mcp.
  humanURL: https://github.com/ogasurfproject-jpg/hs-femtech-mcp
  baseURL: https://femtech.horizonshield.dev/mcp
