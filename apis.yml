aid: horizonshield-dev
name: The HORIZ音s株式会社
description: >-
  The HORIZ音s株式会社 (The HORIZONs Co., Ltd., Hiratsuka, Kanagawa) operates HORIZON SHIELD, a buyer-side,
  agent-native fair-price verification service for Japanese construction and renovation estimates, built by a
  30-year master carpenter on the open JCCDB dataset (95,403 items, CC BY 4.0). Its flagship KIRA server at
  mcp.horizonshield.dev is a free, anonymous remote MCP server (15 tools, 5 prompts) and A2A agent that audits a
  quoted price against fair ranges, flags overcharge tactics, and issues SHA-256 receipts anchored to Bitcoin via
  OpenTimestamps; a FairPriceAttestation tool bridges to Google's AP2 Cart Mandate. Around it sit a public MCP
  Verification Gate (the family's one OpenAPI, plus MCP and A2A) that measures other people's MCP servers against
  an A2A Conduct Extension the company authors, the JIDEC append-only verification ledger with an RFC 9727
  api-catalog, the Yakumo verified-contractor directory MCP, a WebMCP intake server and a femtech source registry —
  every card JWS-signed, every surface unauthenticated by design, and paid for by buyers rather than contractors.
url: https://raw.githubusercontent.com/api-evangelist/horizonshield-dev/refs/heads/main/apis.yml
image: https://shield.the-horizons-innovation.com/horizon_shield_logo_512.png
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (local-v3; was a2a-registry harvest stub)
x-identity-note: >-
  The registrable domain horizonshield.dev has no A/AAAA record on any public resolver (checked 1.1.1.1, 8.8.8.8,
  9.9.9.9 on 2026-09-19) and carries only MCP-registry and a2aregistry verification TXT records; every service runs
  on a subdomain and the company website is https://shield.the-horizons-innovation.com/ (the provider.url in its own
  agent cards). Unrelated to the cybersecurity products at horizonshield.org / horizonshield.ai, as the provider's
  own JSON-LD states.
