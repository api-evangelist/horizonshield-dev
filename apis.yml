    url: a2a/horizonshield-dev-a2a.yml
  - type: AgentCard
    name: A2A Agent Card (provider-hosted, JWS-signed)
    url: https://mcp.horizonshield.dev/.well-known/agent-card.json
- aid: horizonshield-dev:mcp-verification-gate-api
  name: MCP Verification Gate (MCP conduct register) API
  description: >-
    Read-only, keyless REST API at https://gate.horizonshield.dev described by an OpenAPI 3.1.0 document (25
    operations, version 0.4.7): the public register of MCP endpoints measured nightly against five stated
    conditions (speaks MCP, publishes an A2A agent card, declares who pays it, identical input gives identical
    output, the verdict is recomputable), per-endpoint history and change feeds (JSON and Atom), badges and
    embeds, the A2A Conduct Extension v1 specification, hash recomputation and NIP-01/BIP340 event verification,
    and the gate's own self-measurement. The same register is exposed over MCP (5 tools at /mcp) and A2A (/a2a),
    and consumed by the first-party npm client mcp-conduct and a GitHub Action.
  humanURL: https://shield.the-horizons-innovation.com/verify-directory/
