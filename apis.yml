- aid: horizonshield-dev:horizon-shield-kira-a2a-agent
  name: HORIZON SHIELD KIRA A2A Agent
  description: >-
    Agent2Agent surface of the same service: a JWS-signed agent card at
    https://mcp.horizonshield.dev/.well-known/agent-card.json (protocolVersion 0.3.0 with 1.0-style
    supportedInterfaces, JSONRPC, version 1.0.0) declaring three skills — a borderless estimate-integrity audit, a
    Japan property acquisition and renovation intake routed to a licensed real-estate agent, and fail-closed
    verification of a signed integrity claim — plus the provider-authored A2A Conduct Extension disclosing who
    pays the agent (buyer; no referral, listing or success fee). message/send on the same JSON-RPC URL as the MCP
    server returned a completed Task; streaming and push notifications are declared unsupported.
  humanURL: https://shield.the-horizons-innovation.com/
  baseURL: https://mcp.horizonshield.dev
  tags:
  - A2A
