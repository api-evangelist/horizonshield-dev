- aid: horizonshield-dev:jidec-verification-ledger-api
  name: JIDEC Verification Ledger API
  description: >-
    Append-only, Bitcoin-anchored (OpenTimestamps) public ledger of the verification process at
    https://ledger.horizonshield.dev: an index of anchored entries, per-entry raw bytes and .ots proofs, citation
    resolution (/cite/{citation}), executable verification recipes (/verify/{n}), anchored verification paths and
    replay, a witness intake for third-party conduct walks, and agreement records. Discovery is an RFC 9727
    api-catalog served as application/linkset+json, an RFC 9116 security.txt, an llms.txt verification guide and a
    JWS-signed A2A card; a read-only MCP twin (4 tools) runs at https://jidec.horizonshield.dev/mcp. The service
    states it is SCITT-shaped but not a conformant SCITT transparency service.
  humanURL: https://ledger.horizonshield.dev/llms.txt
