- aid: horizonshield-dev:yakumo-verified-contractor-mcp
  name: Yakumo Verified-Contractor Directory MCP
  description: >-
    Remote MCP server at https://hearing.horizonshield.dev/mcp (serverInfo HORIZON SHIELD YAKUMO 2.3.1, protocol
    2025-06-18) exposing six read-only tools over the Yakumo mall, where only contractors that pass the KIRA
    fair-price audit are listed: list verified stores by area and trade, fetch a member profile by number, find a
    contractor from a free-text need, mall overview, how verification works, and check a named contractor
    (returns "not measured" rather than a judgement for non-members). Returns integrity scores and tiers, never
    prices; pending stores are returned separately; zero matches are returned as zero. Its A2A card discloses
    paid_by seller / listing_fee true — the one seller-funded surface in the family.
  humanURL: https://shield.the-horizons-innovation.com/yakumo/
  baseURL: https://hearing.horizonshield.dev/mcp
  tags:
  - MCP
