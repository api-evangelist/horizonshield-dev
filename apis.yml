apis:
- aid: horizonshield-dev:horizon-shield-kira-mcp-server
  name: HORIZON SHIELD KIRA MCP Server
  description: >-
    Remote Model Context Protocol server at https://mcp.horizonshield.dev/ (Streamable HTTP, POST only, protocol
    2025-06-18, serverInfo horizon-shield 1.0.9, listed on registry.modelcontextprotocol.io as
    dev.horizonshield/horizon-shield). Anonymous: initialize, tools/list (15 tools with inputSchema, outputSchema
    and read-only annotations) and prompts/list (5) need no key. Tools return fair min/avg/max price ranges and an
    overcharge danger threshold for 61 Japanese work categories, audit a quoted JPY price, scan estimate wording for
    known high-pressure tactics, issue SHA-256 tamper-evident receipts with a public verify URL, verify such
    receipts fail-closed, create an AP2 FairPriceAttestation (the one ledger-appending tool), and look up
    verification-passed contractors on Yakumo. Also installable as a Claude Code plugin and a Gemini CLI extension
    that connect to the same URL.
  humanURL: https://github.com/ogasurfproject-jpg/horizon-shield#readme
  baseURL: https://mcp.horizonshield.dev
  tags:
  - MCP
  - agent-native
  - Cost Estimation
  - Fair Pricing
  - AP2
  properties:
  - type: MCPServer
    url: mcp/horizonshield-dev-mcp.yml
  - type: MCPServer
    name: KIRA MCP endpoint (Streamable HTTP, POST)
    url: https://mcp.horizonshield.dev/
  - type: ToolCrosswalk
