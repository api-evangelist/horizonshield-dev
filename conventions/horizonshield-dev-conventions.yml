idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: undocumented
  description: >-
    No Idempotency-Key header, parameter or field exists on any write surface and none is documented. What exists
    instead is per-tool ANNOTATION: the KIRA, gate, JIDEC, WebMCP and Yakumo servers mark every tool with
    readOnlyHint / destructiveHint / idempotentHint, and the two ledger-appending tools declare themselves
    non-read-only and non-idempotent (create_ap2_fairness_attestation: readOnlyHint false, idempotentHint false;
    gate check_conformance: idempotentHint false because it triggers a live measurement). Determinism is a separate,
    measured property: the gate's fourth condition is "identical input returns identical output", and the KIRA
    site's stated design goal is "same input, same output, every time" — a read that repeats safely, which is not the
    same as a write that de-duplicates. Ledger records are content-addressed (claim_sha256 / record_sha256), so an
    identical witness or attestation payload hashes to the same id, but nothing documents whether a repeat is
    rejected or appended twice.
  gaps:
  - No idempotency key on POST /witness, POST /check, or the two appending MCP tools.
  - No documented retry guidance for an ambiguous outcome.
dry_run_mode:
  supported: false
  status: none
  note: >-
    No documented dry-run or sandbox twin for a write. The nearest things are read-only by construction and are not
    rehearsals of a write: preview_reverse_estimate ("direction of a rough estimate"), POST /check without
    allow_tool_call (a real measurement that simply skips the tool-call condition), and the conduct-witness skill's
    advice to run the walk WITHOUT --submit first and show the assertions before filing — a client-side preview of a
    ledger submission, documented in the skill, not a server mode.
reversibility:
  grade: none
  docs: https://ledger.horizonshield.dev/llms.txt
  note: >-
    The API's write surfaces all append to public, content-addressed, Bitcoin-anchored records and are irreversible
    BY DESIGN — the provider says so repeatedly and treats it as the product ("records of conduct that the vendor did
    not author and cannot delete"; the Yakumo plans page: "消す機能を作っていません" — we built no delete function; the
    biz page lists "deletion of bad cases" among things that are not for sale). No cancel/void/undo operation exists
    and no window is stated, so the grade is none rather than na: there IS a write surface, and it cannot be taken
    back. The commercial Terms of Service carry real reversal windows, but they govern the human consulting products
    (report delivery, site inspection), not the API, and are recorded below as context only.
  write_surfaces:
  - operation: MCP tool create_ap2_fairness_attestation (mcp.horizonshield.dev)
    action: Append a FairPriceAttestation record to the public ledger
    reversal_operation: null
    window: null
    stated: Each call appends one record to the public ledger, so it is not read-only.
  - operation: POST https://ledger.horizonshield.dev/witness
    action: File a witness walk of any public agent; bundled into a daily Bitcoin-anchored ledger entry
    reversal_operation: null
    window: null
    stated: 'The conduct-witness skill: "You are about to add one line to a record that the agent being walked did not write and cannot delete."; the intake bundles the pool once a day at 00:30 UTC.'
  - operation: POST https://gate.horizonshield.dev/check
    action: Trigger a measurement of an MCP endpoint; the verdict enters /history
    reversal_operation: null
    window: null
    stated: 'Register rows are "scheduled measurements, not endorsements"; the register exposes a removed_rows list and the watchlist an owner_declined flag, and the conduct-witness skill says an operator may decline measurement by serving listing: "decline" in /.well-known/mcp-conduct.json — an opt-out of FUTURE measurement, not a reversal of a recorded verdict.'
  - operation: MCP tool register_source (femtech.horizonshield.dev)
    action: Append a femtech information-source registry entry
    reversal_operation: null
    window: null
  commercial_terms_context:
    url: https://shield.the-horizons-innovation.com/tos
    verbatim:
    - 'レポート納品前のキャンセル： 全額返金（連絡後7営業日以内に処理）'
    - 'レポート納品後のキャンセル： 役務の性質上、返金不可'
    - '完成検査立会い（前日17時までのキャンセル）： 全額返金 ／ （当日キャンセル）： 交通費実費を申し受けます'
    - '前払式チケット（1枚100円）… 有効期限：なし … 役務提供前のキャンセルに限り … 未使用分を返金します。'
    note: Human services only; not an API reversal path.
