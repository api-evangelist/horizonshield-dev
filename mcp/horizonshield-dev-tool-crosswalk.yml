crosswalk:
- tool: get_conditions
  server: gate
  category: register-metadata
  rest: ['GET /spec']
  binding: rest
  confidence: high
  note: Tool description "Return the five conditions this gate measures, what it explicitly does not verify, and the tier definitions" is the /spec document ("The five conditions, stated in full").
- tool: check_conformance
  server: gate
  category: measurement
  rest: ['POST /check']
  binding: rest
  confidence: high
  note: 'Both take an MCP endpoint URL and run a measurement now; the REST body is {"endpoint": "...", "allow_tool_call": bool}. The tool inherits that requestBody as its real input contract (inputSchema requires endpoint).'
- tool: verify_verdict
  server: gate
  category: verification
  rest: ['POST /recompute']
  binding: rest
  confidence: medium
  note: The tool recomputes record_sha256 of a verdict; /recompute "works out which canonicalization reproduces a claimed hash". Same purpose, the REST form is broader (any claimed hash), so medium.
- tool: lookup_server
  server: gate
  category: register-read
  rest: ['GET /register/lookup', 'GET /history']
  binding: rest
  confidence: high
  note: '"Look up what this register already holds about an MCP endpoint: whether it is watched, how often it is re-measured…" = /register/lookup?endpoint= (conduct-v1.1 section 7); past measurements are /history?endpoint=.'
- tool: is_verified
  server: gate
  category: register-read
  rest: ['GET /is-verified']
  binding: rest
  confidence: high
  note: The gate's A2A skill text says the A2A answer is "the same bytes as GET /is-verified"; the tool is the MCP projection of the same read.
