summary: >-
  The only OpenAPI in the family describes the MCP Verification Gate (gate.horizonshield.dev, 25 operations, none
  with an operationId — rows below bind by METHOD PATH). The gate's own five MCP tools map cleanly onto it. The
  flagship KIRA server (15 tools) and the JIDEC ledger server (4 tools) have NO OpenAPI: their REST-shaped
  neighbours are the ledger's RFC 9727 api-catalog routes and KIRA's /ledger/{claim_sha256}, which are documented
  as links, not as a contract, so those tools are recorded as mcp_only with the route they visibly correspond to.
  Nothing here was invented: every tool name comes from a live tools/list and every path from the served spec or
  the served api-catalog / route list.
