summary: >-
  HORIZON SHIELD's conformance profile is the agent-protocol stack plus the IETF discovery RFCs, and it is unusually
  candid about where it stops. Observed on its own hosts: A2A 0.3.0 cards (six, JWS-signed with a JWKS key),
  MCP 2025-06-18 Streamable HTTP, JSON-RPC 2.0, an RFC 9727 API catalog served as application/linkset+json, RFC 9116
  security.txt on two hosts, RFC 7517 JWKS, OpenAPI 3.1.0, an AP2 (Agent Payments Protocol) attestation bridge, and
  an A2A extension the company AUTHORS and serves itself (the Conduct Extension v1, declared by every card in the
  family and by third-party cards on its register). Its ledger uses SCITT vocabulary and states in three places that
  it is NOT a conformant SCITT transparency service and that OpenTimestamps has no RFC/ISO/eIDAS standing. No OAuth,
  OIDC, RFC 9728 or RFC 9457.
