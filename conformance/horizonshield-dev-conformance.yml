    request-level echo") and is declared as GET /ext/conduct/v1 in the gate OpenAPI. The gate register measures
    9 endpoints against it and the ledger anchors witness walks of it.
  note: The company is the author of this extension, not merely an implementer; the contract-level signature is the extension URI in the card.
