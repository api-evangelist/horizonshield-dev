  evidence: >-
    Every card declares capabilities.extensions[].uri = https://gate.horizonshield.dev/ext/conduct/v1 with params
    {compensation: {paid_by, referral_fee, listing_fee, success_fee_pct, disclosure_url}, measured_endpoints,
