summary: >-
  No rate limit is documented for any public API surface, and none was signalled: the KIRA initialize/tools/list,
  gate and ledger responses carried no RateLimit-*, X-RateLimit-* or Retry-After headers, and no 429 was observed.
  The gate spec, the plugin README, the llms.txt and the OpenAPI say nothing about request ceilings. Two adjacent
  facts are recorded so they are not mistaken for API limits: the Yakumo Premium plan describes agent references to a
  member's profile as "within fair use, about 5,000 queries/month as a guide" (a per-member plan allowance, not a
  caller limit), and the gate's watchlist re-measures registered endpoints on a fixed daily cadence (a schedule, not
  a quota). The provider does publish its own traffic — /.well-known/usage-stats.json shows 1,867 external calls in
  the last 30 days — which is a transparency signal rather than a limit.
