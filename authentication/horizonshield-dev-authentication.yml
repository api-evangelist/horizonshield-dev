summary: >-
  Every public surface is anonymous by design and says so: the plugin README ("Read-only, no API key"), the gate
  OpenAPI description ("Read only. No account, no key, no fee."), the ledger security.txt ("read-only and
  unauthenticated by design"), the JIDEC card (securitySchemes {}, security []). Verified live: initialize,
  tools/list, prompts/list, tools/call get_agent_card and A2A message/send all succeeded with no credential on
  mcp.horizonshield.dev; tools/list succeeded on gate., jidec., web., hearing. and femtech.; every REST route probed
  on gate. and ledger. answered without a key. No OAuth/OIDC discovery document exists on any host. The only keys in
  the system are the PROVIDER's signing keys (JWKS, ES256) used to sign agent cards and receipts, and the
  caller-side SHA-256 recomputation that replaces trust in the issuer.
