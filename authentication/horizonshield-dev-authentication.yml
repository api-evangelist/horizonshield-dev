write_surfaces_and_gating:
  - {surface: 'POST https://gate.horizonshield.dev/check', gate: none, note: 'Anyone can request a measurement of any public MCP endpoint; by default no tool is called on the target. allow_tool_call: true is "only for a server you control" — an honour-system instruction, not an enforced credential.'}
  - {surface: 'POST https://ledger.horizonshield.dev/witness', gate: none, note: 'Anyone may submit a witness walk under their own name; acceptance is mechanical schema checking; bundled daily.'}
  - {surface: 'MCP tool create_ap2_fairness_attestation', gate: none, note: Appends a ledger record without any credential.}
  - {surface: 'MCP tool register_source (femtech)', gate: none, note: 'Appends a registry entry after machine checks of five conditions.'}
  - {surface: 'admin routes', gate: 'not public', note: 'The ledger''s privacy block names POST /ledger/append, POST /reference/pin and GET /ledger/pending as admin routes that are "not measured at all"; they were not probed.'}
